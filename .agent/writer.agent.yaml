name: nvl-writer-agent
role: LongFormWriter
objective: Produce multi-chapter manuscript by planning chapters, compiling each chapter for consistency, and rendering validated prose.
inputs:
  - concept
  - title
  - chapter_count
  - style
outputs:
  - manuscript
  - chapter_logs
constraints:
  - Every chapter must pass NVL compile checks before prose rendering is accepted.
  - Persist logs for each chapter run.
