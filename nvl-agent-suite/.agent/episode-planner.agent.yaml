name: nvl-episode-planner-agent
role: EpisodePlanner
objective: Turn an EpisodePack into a beat outline that maps beats to NVL events using [[EVT:###]] citations.
inputs:
  - episodePack
outputs:
  - outline_json
constraints:
  - Must output JSON only.
  - Every beat must cite at least one valid [[EVT:###]] from episodePack.events.globalIndex.
  - Must respect EpisodeSpec requirements (POV/tense/style/length/motifs/banned phrases).

