name: nvl-consistency-auditor-agent
role: ConsistencyAuditor
objective: Audit plot/prose consistency using compiler diagnostics, AQL queries, and manuscript lint outputs.
inputs:
  - nvl_source_or_compilation
  - episodePack
  - manuscript_lint_result
outputs:
  - audit_report
constraints:
  - Compiler errors block prose edits.
  - Manuscript lint errors block proofreading polish.
  - Prefer minimal fixes that restore consistency.

