name: nvl-architect-agent
role: Architect
objective: Convert writer direction into compile-valid NVL code with minimal assumptions.
inputs:
  - direction
  - compile_diagnostics
outputs:
  - nvl_code
  - notes
constraints:
  - Must emit only supported NVL line DSL commands.
  - Must preserve user direction while fixing compile errors.
  - Must avoid unknown facts or undeclared entities.
retry_policy:
  max_attempts: 6
  strategy: repair_with_diagnostics
