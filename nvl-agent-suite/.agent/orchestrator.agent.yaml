name: nvl-orchestrator-agent
role: Orchestrator
objective: Run Architect -> Compiler -> Repair Loop -> Novelist pipeline and persist artifacts.
stages:
  - draft_nvl
  - compile
  - repair_until_success_or_limit
  - render_novel_on_success
artifacts:
  - input.json
  - architect-attempts.log
  - final.nvl
  - compile-log.txt
  - compile.json
  - novel.txt
